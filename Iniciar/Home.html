<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="text-center">
        <h1 class="display-5 mb-5">Bem Vindo</h1>
      </div>
      <div class="main row justify-content-center">
        <form
          action=""
          id="student-form"
          class="row justify-content-center mb-4"
          autocomplete="off">
          <div class="col-10 mb-3">
            <label for="produto">Nome do Produto</label>
            <input
              class="form-control"
              id="produto"
              type="text"
              placeholder="Insira o produto" />
          </div>
          <div class="col-10 mb-3">
            <label for="produto">Código do Produto</label>
            <input
              class="form-control"
              id="produto"
              type="number"
              placeholder="Digite o código" />
          </div>
          <div class="col-10 mb-3">
            <label for="produto">Descrição do Produto</label>
            <input
              class="form-control"
              id="produto"
              type="text"
              placeholder="Descreva o produto" />
          </div>
          <div class="col-10 mb-3">
            <label for="produto">Preço do produto</label>
            <input
              class="form-control"
              id="produto"
              type="number"
              placeholder="Insira o preço" />
          </div>
          <div class="col-10 mb-3">
            <input
              class="btn btn-light add-btn"
              type="submit"
              value="Cadastrar" />
          </div>
        </form>
        <div class="col-12 mt-5">
            <table class="table table-striped table-dark">
             <thead>
              <tr>
                <th>Nome do Produto</th>
                <th>Código do Produto</th>
                <th>Descrição do Produto</th>
                <th>Preço do Produto</th>
              </tr>
             </thead>
             <tbody class="student-list">
              <tr>
                <td>dear</td>
                <td>programer</td>
                <td>25</td>
                <td>
                  <a href="" class="btn btn-warning btn-sm edit">Edit</a>
                  <a href="" class="btn btn-danger btn-sm delete">Delete</a>
                </td>
              </tr>
             </tbody>
             


             </tbody>
        </table>
        </div>
      </div>
    </div>
    <script src=""></script>
  </body>
</html>
