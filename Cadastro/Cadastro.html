<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
  <main class="w-100 m-auto form-container">
    <form id="register-form">
      <!--Cadeado em SVG-->
      <svg xmlns="http://www.w3.org/2000/svg" width="" height="59" fill="currentColor" class="mb-4 bi bi-file-lock" viewBox="0 0 16 16">
        <!-- SVG Path -->
      </svg>
      <h1 class="h3 mb-4 fw-normal text-center">Cadastro</h1>
      <div class="form-floating">
        <input type="text" class="form-control" id="nome" placeholder="Digite Seu Nome">
        <label for="nome">Nome</label>
      </div>
      <div class="form-floating">
        <input type="text" class="form-control" id="sobrenome" placeholder="Digite Seu Sobrenome">
        <label for="sobrenome">Sobrenome</label>
      </div>
      <div class="form-floating">
        <input type="email" class="form-control" id="email" placeholder="Digite Seu email">
        <label for="email">E-mail</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="password" placeholder="Senha">
        <label for="password">Senha</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="confirm-password" placeholder="Confirme Sua Senha">
        <label for="confirm-password">Confirme Sua Senha</label>
      </div>
      <p class="py-2"><a href="/Login/Login.html" class="link-underline-dark">Já Possui uma Conta? Entre</a></p>
      <button type="submit" class="btn btn-primary w-100 py-2 mt-4">Cadastrar</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="register.js"></script>
</body>
</html>
