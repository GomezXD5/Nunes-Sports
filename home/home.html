<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nunes Sports | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body class="bg-body-tertiary">
  <div class="container mt-5">
    <div class="text-center">
      <h1 class="display-5 mb-5">Bem Vindo</h1>
    </div>
    <div class="main row justify-content-center">
      <form action="" id="product-form" class="row justify-content-center mb-4" autocomplete="off">
        <div class="col-10 mb-3">
          <label for="nome">Nome do Produto</label>
          <input class="form-control" id="nome" type="text" placeholder="Insira o produto" />
        </div>
        <div class="col-10 mb-3">
          <label for="codigo">Código do Produto</label>
          <input class="form-control" id="codigo" type="number" placeholder="Digite o código" />
        </div>
        <div class="col-10 mb-3">
          <label for="descricao">Descrição do Produto</label>
          <input class="form-control" id="descricao" type="text" placeholder="Descreva o produto" />
        </div>
        <div class="col-10 mb-3">
          <label for="valor">Preço do produto</label>
          <input class="form-control" id="valor" type="number" placeholder="Insira o preço" />
        </div>
        <div class="col-10 mb-3">
          <input class="btn btn-light add-btn" type="submit" value="Cadastrar" />
        </div>
      </form>
      <div class="col-12 mt-5">
        <table class="table table-striped table-dark">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Código</th>
              <th>Descrição </th>
              <th>Preço</th>
              <th>Função</th>
            </tr>
          </thead>
          <tbody id="product-list">
            <tr>
              <td>dear</td>
              <td>programer</td>
              <td>25</td>
              <td>15</td>
              <td>

                <a href="#" class="btn btn-warning btn-sm edit">Edit</a>
                <a href="#" class="btn btn-danger btn-sm delete">Delete</a>
              </td>
            </tr>
          </tbody>



          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="crud.js"></script>
</body>

</html>
