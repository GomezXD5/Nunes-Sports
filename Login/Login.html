<body class="d-flex align-items-center py-4 bg-body-tertiary">
  <Main class="w-100 m-auto form-container">
    <form>
      <!--Cadeado em SVG-->
      <svg xmlns="http://www.w3.org/2000/svg" width="" height="59" fill="currentColor" class=" mb-4 bi bi-file-lock "
        viewBox="0 0 16 16">
        <path
          d="M8 5a1 1 0 0 1 1 1v1H7V6a1 1 0 0 1 1-1m2 2.076V6a2 2 0 1 0-4 0v1.076c-.54.166-1 .597-1 1.224v2.4c0 .816.781 1.3 1.5 1.3h3c.719 0 1.5-.484 1.5-1.3V8.3c0-.627-.46-1.058-1-1.224M6.105 8.125A.64.64 0 0 1 6.5 8h3a.64.64 0 0 1 .395.125c.085.068.105.133.105.175v2.4c0 .042-.02.107-.105.175A.64.64 0 0 1 9.5 11h-3a.64.64 0 0 1-.395-.125C6.02 10.807 6 10.742 6 10.7V8.3c0-.042.02-.107.105-.175" />

          d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1" />
      </svg>
      <!--Cadeado em SVG-->


      <h1 class="h3 mb-4 fw-normal text-center">Fazer Login</h1>

      <!--Inputs Campos-->
      <Div class="form-floating">
        <input type="email" class="form-control" id="floatingInput" placeholder="Digite Seu email">
        <label for="floatingInput">E-mail</label>
      </Div>
      <Div class="form-floating">
        <input type="password" class="form-control" id="floatingInput" placeholder="Senha" maxlength="10" minlength="8">
        <label for="floatingInput">Senha</label>
      </Div>
      <p class="py-2"><a href="/Cadastro/Cadastro.html" class="link-underline-dark ">Criar Conta</a></p>

      <!--Button Logar-->
      <button class="btn btn-primary w-100 py-2 mt-4">Login</button>



    </form>







  </Main>
  <!-- Link com o Bootstrap-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
